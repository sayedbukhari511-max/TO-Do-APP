<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do App</title>

    <link rel="stylesheet" href="cs.css">
</head>

<body>

    <div class="todo-container">

        <h1>My To-Do List</h1>

        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addBtn">
                Add Task
            </button>

        </div>

        <!-- Task Count -->
        <p id="taskCount">
            Total Tasks: 0
        </p>

        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>

    <script src="try.js"></script>

</body>

</html>
